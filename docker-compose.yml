version: '3.8'

services:
  db:
    image: ankane/pgvector:latest
    container_name: nh_rag_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-gov_rag}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: nh_rag_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    build: .
    container_name: nh_rag_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-password}@db:5432/${DB_NAME:-gov_rag}
      - REDIS_URL=redis://redis:6379/0
      # You can override embedding model path or other ENV variables here
      # - EMBED_MODEL_PATH=/app/models/bge-m3
    depends_on:
      - db
      - redis
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
    restart: unless-stopped

  celery_worker:
    build: .
    container_name: nh_rag_celery
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=1
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-password}@db:5432/${DB_NAME:-gov_rag}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
    restart: unless-stopped

  frontend:
    build: ./rag-dashboard
    container_name: nh_rag_frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

  neo4j:
    image: neo4j:5
    container_name: nh_rag_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

volumes:
  pg_data:
  neo4j_data:
